# Compila e prova SpeedVision a ogni invio su GitHub.
# Quando si crea un'etichetta di versione (es. v0.2.0) prepara anche lo zip per Windows
# e lo pubblica nella pagina Releases.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Installa FFmpeg
        run: choco install ffmpeg -y --no-progress

      # I modelli YOLOX servono ai test di rilevamento: si scaricano una volta e restano in cache.
      - name: Cache dei modelli YOLOX
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\TrafficSpeedAnalyzer\models
          key: yolox-models-v1

      - name: Compila
        run: dotnet build SpeedVision.sln -c Release

      - name: Test
        run: dotnet test SpeedVision.sln -c Release --no-build --blame-hang-timeout 8m

  # Mac con chip Apple (macos-15, M1): FFmpeg compilato da noi, poi calcoli, video e rilevamento.
  # L'interfaccia WPF non si compila su Mac: qui si provano le parti multipiattaforma e l'interfaccia Avalonia
  # (senza schermo, con le schermate di ogni passo tra i file della corsa).
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # FFmpeg si ricompila solo quando cambia lo script (che fissa le versioni).
      - name: Cache di FFmpeg per Mac
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: out/ffmpeg-macos
          key: ffmpeg-macos-arm64-${{ hashFiles('scripts/build-ffmpeg-macos.sh') }}

      - name: Compila FFmpeg (x264 + vidstab)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list pkg-config >/dev/null 2>&1 || brew install pkg-config
          bash scripts/build-ffmpeg-macos.sh out/ffmpeg-macos

      - name: FFmpeg nel PATH
        run: |
          echo "$GITHUB_WORKSPACE/out/ffmpeg-macos" >> "$GITHUB_PATH"
          out/ffmpeg-macos/ffmpeg -hide_banner -version | head -n1

      - name: Cache dei modelli YOLOX
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/TrafficSpeedAnalyzer/models
          key: yolox-models-macos-v1

      - name: Test
        run: |
          for t in Core Video Detection Presentation Desktop; do
            dotnet test tests/TrafficSpeedAnalyzer.$t.Tests -c Release --blame-hang-timeout 8m \
              --logger "console;verbosity=normal" || exit 1
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schermate-macos
          path: tests/TrafficSpeedAnalyzer.Desktop.Tests/bin/Release/net10.0/screenshots
          if-no-files-found: ignore

      # FFmpeg pronto per il pacchetto Mac (fase 5): si scarica dalla pagina dell'esecuzione.
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-arm64
          path: out/ffmpeg-macos

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Versione autonoma: SpeedVision.exe con .NET incluso e FFmpeg nella cartella "ffmpeg".
      # Chi la scarica estrae lo zip e avvia SpeedVision.exe, senza installare nulla.
      - name: Prepara lo zip per Windows
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/package-release.ps1 -Version $version -OutDir out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/SpeedVision-*-win-x64.zip
          generate_release_notes: true
